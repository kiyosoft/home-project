# Named Cloudflare Tunnel config for Ethio Home (dashboard + Home Assistant).
#
# Setup:
#   1. cloudflared tunnel login
#   2. cloudflared tunnel create ethio-home
#   3. Copy this file to config.yml (gitignored) and fill in tunnel UUID + credentials-file
#   4. cloudflared tunnel route dns ethio-home dashboard.example.com
#   5. cloudflared tunnel route dns ethio-home ha.example.com
#   6. pnpm tunnel:named
#
# Optional: put Cloudflare Access in front of both hostnames before sharing broadly.

tunnel: <TUNNEL_UUID>
credentials-file: /absolute/path/to/<TUNNEL_UUID>.json

# Home Assistant must trust this host as a reverse proxy, or you get 400 Bad Request:
#   http:
#     use_x_forwarded_for: true
#     trusted_proxies:
#       - 192.168.100.0/24

ingress:
  - hostname: dashboard.example.com
    service: http://127.0.0.1:5180
  - hostname: ha.example.com
    service: http://homeassistant.local:8123
    originRequest:
      httpHostHeader: homeassistant.local
  - service: http_status:404
