<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ethio Home companion</title>
    <!--
      IndieAuth client identifier document for the Ethio Home mobile app.

      Home Assistant fetches this page during login and only accepts a callback
      that appears here (homeassistant/components/auth/indieauth.py,
      verify_redirect_uri). Changing the href below breaks sign-in for every
      installed copy of the app, so treat it as a released constant.

      This hosted copy is only a fallback. The Et Remote Access add-on
      publishes the same document into Home Assistant's own `www` folder, which
      is what the app prefers because it needs no internet at all; see
      et_remote_access/rootfs/opt/et_remote_access/client-id.html in the
      et-home-remote repository.
    -->
    <link rel="redirect_uri" href="ethiohome://auth-callback" />
  </head>
  <body>
    <h1>Ethio Home companion</h1>
    <p>
      This page exists so Home Assistant can verify the Ethio Home mobile app
      during sign-in. There is nothing to do here.
    </p>
  </body>
</html>
