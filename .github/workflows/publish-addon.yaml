# Builds the dashboard and publishes the Home Assistant add-on image to GHCR.
# Runs on push to main for now; switch the trigger to `release` when tagging.
name: Publish add-on

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  APP: ethio-home

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      architectures: ${{ steps.info.outputs.architectures }}
      build_matrix: ${{ steps.matrix.outputs.matrix }}
      image_name: ${{ steps.normalize.outputs.image_name }}
      name: ${{ steps.normalize.outputs.name }}
      description: ${{ steps.normalize.outputs.description }}
      url: ${{ steps.normalize.outputs.url }}
      registry_prefix: ${{ steps.normalize.outputs.registry_prefix }}
      version: ${{ steps.normalize.outputs.version }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Get add-on information
        id: info
        uses: home-assistant/actions/helpers/info@master
        with:
          path: "./${{ env.APP }}"

      - name: Normalize add-on information
        id: normalize
        # Pass info-helper outputs via env (NOT inlined into the script): yq -o=json
        # wraps scalars in quotes, and the description contains parentheses, which
        # would otherwise break the shell parser.
        env:
          INFO_IMAGE: ${{ steps.info.outputs.image }}
          INFO_VERSION: ${{ steps.info.outputs.version }}
          INFO_NAME: ${{ steps.info.outputs.name }}
          INFO_DESCRIPTION: ${{ steps.info.outputs.description }}
          INFO_URL: ${{ steps.info.outputs.url }}
        run: |
          # The info helper preserves the literal quotes from quoted config.yaml
          # scalars (e.g. version: "0.6.0"), so strip them where the value flows
          # into an image reference / tag.
          image="${INFO_IMAGE//\"/}"
          echo "image_name=${image##*/}" >> "$GITHUB_OUTPUT"
          echo "registry_prefix=${image%/*}" >> "$GITHUB_OUTPUT"
          echo "version=${INFO_VERSION//\"/}" >> "$GITHUB_OUTPUT"
          echo "name=${INFO_NAME//\"/}" >> "$GITHUB_OUTPUT"
          echo "description=${INFO_DESCRIPTION//\"/}" >> "$GITHUB_OUTPUT"
          url="${INFO_URL//\"/}"
          if [[ -n "$url" && "$url" != "null" ]]; then
            echo "url=${url}" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare build matrix
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@2026.06.0
        with:
          architectures: ${{ steps.info.outputs.architectures }}
          image-name: ${{ steps.normalize.outputs.image_name }}
          registry-prefix: ${{ steps.normalize.outputs.registry_prefix }}

  dashboard:
    name: Build dashboard
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build dashboard
        run: pnpm build

      - name: Upload dashboard web root
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-www
          path: apps/dashboard/dist
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build ${{ matrix.arch }} image
    needs: [prepare, dashboard]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.build_matrix) }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Download dashboard web root
        uses: actions/download-artifact@v4
        with:
          name: dashboard-www
          path: ${{ env.APP }}/www

      - name: Confirm web root
        run: test -f "${{ env.APP }}/www/index.html"

      - name: Build image
        uses: home-assistant/builder/actions/build-image@2026.06.0
        with:
          arch: ${{ matrix.arch }}
          cache-gha-scope: ethio-home
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          context: "./${{ env.APP }}"
          image: ${{ matrix.image }}
          image-tags: |
            ${{ needs.prepare.outputs.version }}
            latest
          labels: |
            io.hass.type=addon
            io.hass.name=${{ needs.prepare.outputs.name }}
            io.hass.description=${{ needs.prepare.outputs.description }}
            ${{ needs.prepare.outputs.url && format('io.hass.url={0}', needs.prepare.outputs.url) || '' }}
          push: true
          version: ${{ needs.prepare.outputs.version }}

  manifest:
    name: Publish multi-arch manifest
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      packages: write
    steps:
      - name: Publish multi-arch manifest
        uses: home-assistant/builder/actions/publish-multi-arch-manifest@2026.06.0
        with:
          architectures: ${{ needs.prepare.outputs.architectures }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image-name: ${{ needs.prepare.outputs.image_name }}
          image-tags: |
            ${{ needs.prepare.outputs.version }}
            latest
          registry-prefix: ${{ needs.prepare.outputs.registry_prefix }}
